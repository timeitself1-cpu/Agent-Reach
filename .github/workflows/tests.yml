name: tests

# Offline test suite and lint on every push and pull request. No Ollama or live
# data: the suite uses mock HTTP and a fake Ollama (see tests/fakes.py).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: pyflakes
        run: python -m pyflakes agent_reach paperclip_bridge tests

      - name: pytest
        run: python -m pytest

      - name: CLI smoke test
        run: python -m agent_reach --no-llm --help
